dexjoco_root: ${oc.env:DEXJOCO_LEROBOT_ROOT,/home/shared/ai/datasets/dexlewm/dexjoco}

contract:
  action_dim: 22
  arm_action_dim: 6
  hand_action_dim: 16
  proprio_dim: 23
  action_mode: absolute_tcp_xyz_rotvec
  quaternion_order: wxyz

train:
  _target_: fastwam.datasets.lerobot.dexjoco_robot_video_dataset.DexJoCoRobotVideoDataset
  dataset_dirs:
    - ${data.dexjoco_root}/water_plant
    - ${data.dexjoco_root}/hammer_nail
    - ${data.dexjoco_root}/click_mouse
    - ${data.dexjoco_root}/pick_bucket
    - ${data.dexjoco_root}/pinch_tongs
    - ${data.dexjoco_root}/fold_glasses
  task_names:
    - water_plant
    - hammer_nail
    - click_mouse
    - pick_bucket
    - pinch_tongs
    - fold_glasses
  split: train
  shape_meta:
    images:
      - key: primary
        raw_shape: [3, 640, 640]
        shape: [3, 224, 224]
      - key: wrist
        raw_shape: [3, 640, 640]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 22
        shape: 22
    state:
      - key: default
        raw_shape: 23
        shape: 23
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.1
  is_training_set: true
  seed: 42
  skip_padding_as_possible: false
  concat_multi_camera: horizontal
  return_camera_videos: true
  pretrained_norm_stats: null
  processor:
    _target_: fastwam.datasets.lerobot.processors.dexjoco_processor.DexJoCoFastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 22
    proprio_output_dim: 23
    delta_action_dim_mask: null
    allow_non_production_stats: false
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/dexjoco
  context_len: 128

validation:
  enabled: true
  val_set_proportion: 0.1
  split_seed: 42
